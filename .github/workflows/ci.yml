name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Stage 1: Setup (derive SHAs used by `nx affected`)
  setup:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.set-shas.outputs.base }}
      head: ${{ steps.set-shas.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive SHAs for Nx affected
        id: set-shas
        uses: nrwl/nx-set-shas@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

  # Stage 2: Lint (runs concurrently)
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint affected projects
        run: |
          npx nx affected -t lint \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3

  # Stage 3: Test (runs concurrently)
  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Test affected projects
        run: |
          npx nx affected -t test \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3

  # Stage 4: Type check (runs concurrently)
  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check affected projects
        run: |
          npx nx affected -t typecheck \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3

  # Stage 5: Build for PR validation (only runs on PRs)
  build:
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build affected projects
        run: |
          npx nx affected -t build \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3

  # Stage 6: Build and Publish to GitHub Packages (only on main push)
  build-and-publish:
    needs: [setup, test, typecheck, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          always-auth: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Keep building before releasing so publish has fresh artifacts
      - name: Build affected projects
        run: |
          npx nx affected -t build \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3

      # version + changelog + publish (only affected)
      - name: Release affected (version, changelog, publish)
        env:
          # GitHub Packages auth for npm publish
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get affected projects from packages/ directory (which are the publishable ones)
          AFFECTED="$(npx nx show projects --affected \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --projects="packages/*" \
            --sep=",")"

          if [ -z "$AFFECTED" ]; then
            echo "No affected projects. Skipping release."
            exit 0
          fi

          echo "Affected projects: $AFFECTED"

          # Check for first release (packages without version in package.json)
          FIRST_RELEASE=""
          for project in ${AFFECTED//,/ }; do
            PKG_PATH="packages/${project#@verid-sdk-js-mono/}/package.json"
            if [ -f "$PKG_PATH" ]; then
              VERSION=$(node -p "require('./$PKG_PATH').version || ''")
              if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0" ]; then
                echo "First release detected for $project"
                FIRST_RELEASE="$FIRST_RELEASE,$project"
              fi
            fi
          done

          # Remove leading comma if exists
          FIRST_RELEASE="${FIRST_RELEASE#,}"

          # Run release with first-release flag if needed
          if [ -n "$FIRST_RELEASE" ]; then
            echo "Running first release for: $FIRST_RELEASE"
            npx nx release -y --projects="$FIRST_RELEASE" --first-release --verbose
            
            # Remove first release projects from affected list
            REMAINING_AFFECTED=""
            for project in ${AFFECTED//,/ }; do
              if [[ ! "$FIRST_RELEASE" =~ "$project" ]]; then
                REMAINING_AFFECTED="$REMAINING_AFFECTED,$project"
              fi
            done
            REMAINING_AFFECTED="${REMAINING_AFFECTED#,}"
            
            # Release remaining projects normally
            if [ -n "$REMAINING_AFFECTED" ]; then
              echo "Running normal release for: $REMAINING_AFFECTED"
              npx nx release -y --projects="$REMAINING_AFFECTED" --verbose
            fi
          else
            # No first releases, run normal release
            echo "Running normal release for: $AFFECTED"
            npx nx release -y --projects="$AFFECTED" --verbose
          fi


  # Stage 7: Nx self-healing (optional)
  nx-cloud-fix:
    needs: [setup, lint, test, typecheck]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Nx CI self-healing
        if: always()
        run: |
          npx nx fix-ci || npx nx reset || true
