name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # Stage 1: Setup (derive SHAs used by `nx affected`)
  setup:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.set-shas.outputs.base }}
      head: ${{ steps.set-shas.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive SHAs for Nx affected
        id: set-shas
        uses: nrwl/nx-set-shas@v4

      - name: Enable Corepack
        run: npm install -g corepack && corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

  # Stage 2: Lint (runs concurrently)
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint affected projects
        run: |
          yarn nx affected -t lint \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3 \
            --output-style=stream --verbose

  # Stage 3: Test (runs concurrently)
  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Test affected projects
        run: |
          yarn nx affected -t test \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3 \
            --output-style=stream --verbose

  # Stage 4: Type check (runs concurrently)
  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Type check affected projects
        run: |
          yarn nx affected -t typecheck \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3 \
            --output-style=stream --verbose

  # Stage 5: Build for PR validation (only runs on PRs)
  build:
    needs: setup
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build affected projects
        run: |
          yarn nx affected -t build \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3 \
            --output-style=stream --verbose

  # Stage 6: Build and Publish to npm & GitHub Packages (only on main push)
  build-and-publish:
    needs: [setup, test, typecheck, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Corepack
        run: npm install -g corepack && corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Ensure local main is up-to-date before nx release pushes commits/tags
      - name: Pull latest changes
        run: git pull --rebase origin main

      # Keep building before releasing so publish has fresh artifacts
      - name: Build affected projects
        run: |
          yarn nx affected -t build \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --parallel=3 --max-parallel=3 \
            --output-style=stream --verbose

      # version + changelog + publish to npm (only affected)
      - name: Release affected (version, changelog, publish to npm)
        env:
          # npm registry auth for publish
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get affected projects from packages/ directory (which are the publishable ones)
          AFFECTED="$(yarn nx show projects --affected \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --projects="packages/*" \
            --sep=",")"

          if [ -z "$AFFECTED" ]; then
            echo "No affected projects. Skipping release."
            exit 0
          fi

          echo "Affected projects: $AFFECTED"

          # Check for first release: a project has never been released when no release
          # tag exists for it. Tags follow nx.json's releaseTagPattern, "{projectName}@{version}".
          # (checkout uses fetch-depth: 0, so all tags are present.)
          FIRST_RELEASE=""
          for project in ${AFFECTED//,/ }; do
            if [ -z "$(git tag --list "$project@*")" ]; then
              echo "First release detected for $project (no existing release tag)"
              FIRST_RELEASE="$FIRST_RELEASE,$project"
            fi
          done

          # Remove leading comma if exists
          FIRST_RELEASE="${FIRST_RELEASE#,}"

          # Run release with first-release flag if needed
          if [ -n "$FIRST_RELEASE" ]; then
            echo "Running first release for: $FIRST_RELEASE"
            yarn nx release -y --projects="$FIRST_RELEASE" --first-release --verbose

            # Remove first release projects from affected list (exact match on the
            # comma-delimited list, so one project name cannot shadow a longer one)
            REMAINING_AFFECTED=""
            for project in ${AFFECTED//,/ }; do
              case ",$FIRST_RELEASE," in
                *",$project,"*) ;;
                *) REMAINING_AFFECTED="$REMAINING_AFFECTED,$project" ;;
              esac
            done
            REMAINING_AFFECTED="${REMAINING_AFFECTED#,}"

            # Release remaining projects normally
            if [ -n "$REMAINING_AFFECTED" ]; then
              echo "Running normal release for: $REMAINING_AFFECTED"
              yarn nx release -y --projects="$REMAINING_AFFECTED" --verbose
            fi
          else
            # No first releases, run normal release
            echo "Running normal release for: $AFFECTED"
            yarn nx release -y --projects="$AFFECTED" --verbose
          fi

      # Publish to GitHub Packages as a secondary registry. Non-blocking: npm is the
      # primary registry, so a failure here must not fail the release.
      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AFFECTED="$(yarn nx show projects --affected \
            --base=${{ needs.setup.outputs.base }} \
            --head=${{ needs.setup.outputs.head }} \
            --projects="packages/*" \
            --sep=",")"

          if [ -z "$AFFECTED" ]; then
            echo "No affected projects. Skipping GitHub Packages publish."
            exit 0
          fi

          # setup-node only wrote an auth line for registry.npmjs.org; add one for
          # GitHub Packages so the publish can authenticate against it.
          echo "//npm.pkg.github.com/:_authToken=$NODE_AUTH_TOKEN" >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          # Publishes the versions the release step just committed. Nx resolves each
          # project's directory itself and skips versions already on the registry.
          echo "Publishing to GitHub Packages: $AFFECTED"
          yarn nx release publish \
            --projects="$AFFECTED" \
            --registry=https://npm.pkg.github.com \
            --verbose

  # Stage 7: Nx self-healing (optional)
  nx-cloud-fix:
    needs: [setup, lint, test, typecheck]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: npm install -g corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Nx CI self-healing
        if: always()
        run: |
          yarn nx fix-ci || yarn nx reset || true
