query FindManyAttributesDeep($input: FindManyAttributesInput) {
  findManyAttributes(input: $input) {
    edges {
      node {
        uuid
        name
        locales {
          edges {
            node {
              locale
              label
              description
            }
          }
        }
        credential {
          uuid
          name
          locales {
            edges {
              node {
                locale
                name
                description
              }
            }
          }
        }
      }
    }
  }
}
