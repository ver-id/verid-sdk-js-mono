query FindManyAttributesDeep($input: FindManyAttributesInput) {
  findManyAttributes(input: $input) {
    edges {
      node {
        uuid
        name
        locale {
          edges {
            node {
              locale
              i18n
            }
          }
        }
        credential {
          uuid
          name
          locale {
            edges {
              node {
                locale
                i18n
              }
            }
          }
          issuer {
            uuid
            name
            locale {
              edges {
                node {
                  locale
                  i18n
                }
              }
            }
            scheme {
              uuid
              name
              locale {
                edges {
                  node {
                    locale
                    i18n
                  }
                }
              }
              provider {
                uuid
                name
                locale {
                  edges {
                    node {
                      locale
                      i18n
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
